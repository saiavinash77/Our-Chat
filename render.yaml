services:
  - type: web
    name: our-chat
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: chat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ROOM_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "22"
