<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Thallisaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ============ LOCK SCREEN ============ -->
  <section id="lockView" class="view">
    <div class="lock-card">
      <div class="lock-hearts">&#x1F4AC;</div>
      <h1>Thallisaa</h1>
      <p class="lock-sub">Private chat</p>
      <input id="lockPass" type="password" placeholder="Password" autocomplete="off">
      <button id="unlockBtn" class="btn-primary">Enter</button>
      <p id="lockError" class="error"></p>
    </div>
    <div class="lock-foot">🔒 Private room · only for us</div>
  </section>

  <!-- ============ CHAT VIEW ============ -->
  <section id="chatView" class="view hidden">
    <header class="wa-header chat-header">
      <button class="wa-icon back-btn" id="lockBtn" title="Lock">🔒</button>
      <div class="wa-avatar wa-avatar-love" id="chatAvatar">&#x1F4AC;</div>
      <div class="chat-header-info">
        <div class="chat-title">Thallisaa</div>
        <div class="chat-subtitle" id="chatSubtitle">connecting…</div>
      </div>
      <div class="wa-header-icons">
        <button class="wa-icon" title="Video call">📹</button>
        <button class="wa-icon" title="Voice call">📞</button>
        <button class="wa-icon" title="Menu" id="menuBtn">⋮</button>
      </div>
    </header>
    <div id="themePanel" class="theme-panel hidden">
      <div class="theme-panel-title">Wallpaper</div>
      <div class="theme-options" id="themeOptions"></div>
    </div>

    <div class="wallpaper" id="messages"></div>

    <div class="composer-wrap">
      <div id="emojiPanel" class="emoji-panel hidden"></div>
      <div id="recBar" class="rec-bar hidden">
        <span class="rec-dot"></span><span id="recTime">0:00</span>
        <span class="rec-hint">Recording…</span>
        <button id="recCancel" class="rec-btn">✕</button>
        <button id="recSend" class="rec-btn send">➤</button>
      </div>
      <form id="composer" class="composer">
        <button type="button" class="wa-icon composer-icon" id="emojiBtn" title="Emoji">😊</button>
        <input id="fileInput" type="file" class="hidden">
        <input id="textInput" type="text" placeholder="Message" autocomplete="off" maxlength="4000">
        <button type="button" class="wa-icon composer-icon" id="attachBtn" title="Attach image">📎</button>
        <button type="button" class="wa-icon composer-icon hidden" id="micBtn" title="Voice message">🎤</button>
        <button type="submit" class="wa-icon composer-icon hidden" id="sendBtn" title="Send">➤</button>
      </form>
    </div>
  </section>

  <div id="ctxMenu" class="ctx-menu hidden">
    <button id="ctxEdit">✏️ Edit</button>
    <button id="ctxDelete" class="danger">🗑 Delete</button>
  </div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
